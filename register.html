<!-- /register.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 / 로그인 - Jump</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/pages/apply-guide.css" />
  <link rel="stylesheet" href="/assets/css/pages/register.css" />

  <script src="/assets/js/partials.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="panel">
      <h1 class="title">회원가입 / 로그인</h1>
      <p class="desc">전화번호로 인증 후 수탁 지갑이 자동으로 생성됩니다.</p>

      <div id="regState" class="state"></div>

      <!-- ── 인증 섹션 (로그인 전) ── -->
      <div id="authSection">
        <div class="auth-tabs">
          <button class="auth-tab auth-tab--active" id="tabPhone" type="button">📱 전화번호</button>
          <button class="auth-tab" id="tabGoogle" type="button">🔑 Google</button>
        </div>

        <!-- 전화번호 인증 패널 -->
        <div id="panelPhone" style="padding-top:4px;">
          <div class="field">
            <span>전화번호 <em class="req">*</em></span>
            <div class="phone-row">
              <input type="tel" id="inputPhone" maxlength="20"
                placeholder="+84 912 345 678  /  +82 10 1234 5678"
                autocomplete="tel" />
              <button class="btn btn--primary btn--sm" id="btnSendOtp" type="button">인증번호 받기</button>
            </div>
          </div>
          <div id="otpSection" class="field" style="display:none;">
            <span>인증번호 6자리 <em class="req">*</em></span>
            <div class="phone-row">
              <input type="text" id="inputOtp" maxlength="6" placeholder="123456"
                inputmode="numeric" class="otp-input" autocomplete="one-time-code" />
              <button class="btn btn--primary btn--sm" id="btnVerifyOtp" type="button">확인</button>
            </div>
            <small>문자가 오지 않으면 위에서 다시 시도해 주세요.</small>
          </div>
          <div id="authMsg" class="auth-msg"></div>
          <div id="recaptchaContainer"></div>
        </div>

        <!-- Google 인증 패널 -->
        <div id="panelGoogle" style="display:none;padding-top:12px;">
          <p style="font-size:13px;color:var(--muted);margin:0 0 14px;">Google 계정으로 바로 로그인합니다.</p>
          <button class="btn btn--primary" id="btnGoogleLogin" type="button">🔑 Google 로그인</button>
          <div id="googleMsg" class="auth-msg" style="margin-top:8px;"></div>
        </div>
      </div>

      <!-- ── 이미 가입 완료 ── -->
      <div id="alreadyDone" style="display:none;" class="status-box">
        <div class="status-row">
          <div class="k">가입 상태</div>
          <div class="v" style="color:var(--accent);">가입 완료 ✓</div>
        </div>
        <div class="status-row" id="phoneRow" style="display:none;">
          <div class="k">휴대폰 번호</div>
          <div class="v" style="display:flex;align-items:center;gap:8px;">
            <span id="phoneDisplay">-</span>
            <button class="btn btn--sm" id="btnEditPhone" type="button">수정</button>
          </div>
        </div>
        <div id="phoneEditBox" style="display:none;margin:8px 0 4px;">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <input type="tel" id="phoneEditInput" maxlength="30" placeholder="예: +82 10 1234 5678"
              style="flex:1;min-width:160px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:0.9rem;" />
            <button class="btn btn--primary btn--sm" id="btnSavePhone" type="button">저장</button>
            <button class="btn btn--sm" id="btnCancelPhone" type="button">취소</button>
          </div>
          <div id="phoneSaveMsg" style="font-size:0.82em;margin-top:4px;"></div>
        </div>
        <div class="status-row" id="walletRow" style="display:none;">
          <div class="k">수탁 지갑 주소</div>
          <div class="v mono" id="walletAddr">-</div>
        </div>
        <div class="status-row" id="onChainRow" style="display:none;">
          <div class="k">온체인 등록</div>
          <div class="v" id="onChainStatus">-</div>
        </div>
        <a href="/index.html" class="btn btn--primary" style="margin-top:16px;display:inline-block;">홈으로</a>
      </div>

      <!-- ── 가입 폼 (신규 사용자) ── -->
      <form class="form" id="regForm" style="display:none;" novalidate>

        <label class="field">
          <span>이름 (실명) <em class="req">*</em></span>
          <input type="text" id="userName" maxlength="30" placeholder="예: 홍길동" autocomplete="name" />
        </label>

        <label class="field">
          <span>휴대폰 번호 <em class="req">*</em></span>
          <input type="tel" id="userPhone" maxlength="30" placeholder="예: +82 10 1234 5678 / +84 912 345 678" autocomplete="tel" />
        </label>

        <label class="field">
          <span>멘토 지갑 주소</span>
          <input type="text" id="mentorAddress" maxlength="42" placeholder="예: 0xAbCd...1234" autocomplete="off" spellcheck="false" />
          <small class="help-text">추천인(멘토)의 수탁 지갑 주소 · 없으면 기본값이 자동 입력됩니다</small>
        </label>

        <div class="reg-divider">이용 약관</div>

        <label class="check">
          <input type="checkbox" id="agreeTerms" />
          <span>
            <a href="/what.html" target="_blank">이용약관</a> 및
            <a href="/what.html" target="_blank">개인정보처리방침</a>에 동의합니다 <em class="req">*</em>
          </span>
        </label>

        <label class="check">
          <input type="checkbox" id="agreeWallet" />
          <span>
            서버 수탁 지갑(私有鍵 서버 보관) 생성 및 온체인 가입에 동의합니다 <em class="req">*</em>
          </span>
        </label>

        <!-- 진행 상황 -->
        <div id="stepBox" class="step-box" style="display:none;">
          <div class="step" id="step1">① 정보 저장</div>
          <div class="step" id="step2">② 수탁 지갑 생성</div>
          <div class="step" id="step3">③ 온체인 등록</div>
        </div>

        <div class="actions">
          <button class="btn btn--primary" type="submit" id="btnRegister">가입 완료</button>
        </div>

        <p class="hint">
          수탁 지갑 생성과 온체인 회원 등록이 자동으로 진행됩니다.<br>
          멘토 주소를 모르거나 없으면 기본 멘토 주소가 자동으로 입력됩니다.
        </p>
      </form>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="/assets/js/header-auth.js"></script>
  <script type="module" src="/assets/js/pages/register.js"></script>
</body>
</html>
