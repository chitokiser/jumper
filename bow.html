<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>활쏘기 | JumpDAO — 몬스터 사냥</title>
<meta name="description" content="1분 동안 몬스터를 최대한 많이 잡아 GP를 획득하세요!"/>
<meta property="og:title" content="활쏘기 | JumpDAO"/>
<meta property="og:description" content="활쏘기 몬스터 사냥 미니게임"/>
<link rel="canonical" href="/bow.html"/>
<meta name="robots" content="noindex"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050510;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;touch-action:none;user-select:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px 12px;gap:10px;overflow-y:auto}
.screen.hidden{display:none!important}

/* ── 로비 ── */
.bow-title{font-size:clamp(22px,6vw,34px);font-weight:900;letter-spacing:-1px;text-align:center;line-height:1.1}
.bow-title span{color:#f59e0b}
.stat-card{background:#111827;border:1px solid #1f2937;border-radius:14px;
  padding:12px 18px;width:100%;max-width:320px}
.stat-card h3{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sr{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sr .lbl{color:#9ca3af}.sr .val{font-weight:700}
.badge{background:#1e40af;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700}
.btn-main{padding:11px 32px;background:#f59e0b;color:#000;border:none;
  border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 20px rgba(245,158,11,.4);transition:opacity .15s;width:100%;max-width:280px}
.btn-main:active{opacity:.8}.btn-main:disabled{opacity:.4;cursor:not-allowed}

/* ── 스킬 선택 ── */
#skillScreen h2{font-size:17px;font-weight:800}
#skillGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:340px}
.sp-btn{background:#111827;border:2px solid #1f2937;border-radius:11px;
  padding:9px 5px;cursor:pointer;color:#fff;text-align:center;transition:all .15s;line-height:1.3}
.sp-emoji{font-size:20px;display:block;margin-bottom:3px}
.sp-name{font-size:10px;font-weight:700}
.sp-mp{font-size:8.5px;color:#60a5fa;margin-top:1px}
.sp-desc{font-size:7.5px;color:#6b7280;margin-top:2px}
.sp-btn.sel{border-color:#f59e0b;background:#1c1400}

/* ── 카운트다운 ── */
#countdownScreen{text-align:center}
#cdNum{font-size:clamp(72px,20vw,100px);font-weight:900;color:#f59e0b;
  text-shadow:0 0 40px #f59e0b88;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ── 게임 ── */
#gameScreen{padding:0;display:flex;align-items:center;justify-content:center;background:#050510}
#canvasWrap{position:relative;width:100%;max-width:400px;margin:0 auto;background:#050510}
#canvasWrap:fullscreen,#canvasWrap:-webkit-full-screen{
  max-width:100%;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#bowCanvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;
  -webkit-tap-highlight-color:transparent}
/* 전체화면 버튼 */
#btnFs{
  position:absolute;top:6px;right:8px;z-index:10;
  background:rgba(0,0,0,.6);border:none;border-radius:6px;
  padding:4px 7px;font-size:14px;cursor:pointer;pointer-events:all;color:#fff
}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#hudTop{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px;gap:4px}
.hb{background:rgba(0,0,0,.72);border-radius:8px;padding:4px 9px;font-size:11px;
  font-weight:700;backdrop-filter:blur(2px)}
#timerTxt{font-size:22px;font-weight:900;min-width:42px;text-align:center}
#timerTxt.urgent{color:#ef4444;animation:pulse .5s ease-in-out infinite}
#scoreTxt{font-size:12px;color:#fbbf24}
/* HP 바 */
#hpBox{display:flex;align-items:center;gap:4px;font-size:10px}
.hp-bg{width:55px;height:6px;background:#1f2937;border-radius:3px;overflow:hidden}
#hpFill{height:100%;background:#ef4444;border-radius:3px;transition:width .25s}
#hpBox.danger #hpFill{background:#ff2020;animation:hpPulse .4s ease-in-out infinite}
@keyframes hpPulse{0%,100%{opacity:1}50%{opacity:.4}}

#mpBox{display:flex;flex-direction:column;gap:2px;min-width:60px;text-align:right}
.mp-row{display:flex;align-items:center;gap:3px;font-size:9px}
.mp-bg{flex:1;height:5px;background:#1f2937;border-radius:3px;overflow:hidden}
#mpFill{height:100%;background:#3b82f6;border-radius:3px;transition:width .25s}

/* 대포 피격 경고 오버레이 */
#cannonWarning{
  position:absolute;inset:0;pointer-events:none;
  border:3px solid transparent;border-radius:4px;transition:border-color .1s;
}
#cannonWarning.alert{border-color:rgba(255,60,0,.7);animation:warningFlash .25s ease-in-out infinite}
@keyframes warningFlash{0%,100%{opacity:1}50%{opacity:.3}}

/* 콤보 */
#comboBox{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;display:none}
#comboNum{font-size:clamp(26px,8vw,42px);font-weight:900;color:#f59e0b;
  text-shadow:0 0 20px #f59e0b88}
#comboLbl{font-size:9px;color:#fbbf24;letter-spacing:3px;text-transform:uppercase}

/* 스킬바 */
#skillBar{
  position:absolute;right:8px;bottom:6px;
  display:flex;flex-direction:column;gap:5px;pointer-events:all;
}
.sk-btn{display:flex;flex-direction:column;align-items:center;gap:1px;
  background:rgba(0,0,0,.85);border:2px solid #374151;border-radius:10px;
  padding:5px 8px;font-size:16px;cursor:pointer;position:relative;
  min-width:48px;color:#fff;transition:opacity .2s;pointer-events:all}
.sk-btn small{font-size:7.5px;color:#9ca3af;white-space:nowrap}
.sk-btn .cd{position:absolute;top:1px;right:3px;font-size:9px;font-weight:700;color:#fbbf24}
.sk-btn.on{border-color:#f59e0b;background:rgba(245,158,11,.2)}

/* ── 결과 ── */
#resultScreen{text-align:center}
.res-title{font-size:26px;font-weight:900;color:#f59e0b;margin-bottom:4px}
#resFinalScore{font-size:clamp(36px,10vw,52px);font-weight:900;margin:6px 0}
#resGP{font-size:20px;color:#22c55e;font-weight:700}
#resInfo{font-size:13px;color:#9ca3af;margin-top:6px}

/* ── 모바일 최적화 ── */
@media(max-width:480px){
  /* 스킬 버튼 터치 영역 확대 */
  .sk-btn{min-width:54px;padding:7px 10px;font-size:18px}
  .sk-btn small{font-size:8.5px}
  /* 스킬 선택 그리드 2열 */
  #skillGrid{grid-template-columns:repeat(2,1fr);max-width:260px}
  /* 로비 버튼 여백 확보 */
  .btn-main{padding:13px 28px;font-size:16px}
  /* safe-area: 노치/홈바 대응 */
  #gameScreen{padding-bottom:env(safe-area-inset-bottom,0)}
}
/* ── 로딩 ── */
#loadingScreen{font-size:15px;color:#9ca3af;gap:14px}
.spin{width:34px;height:34px;border:3px solid #1f2937;border-top-color:#f59e0b;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 게임 헤더 ── */
.g-hdr{display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:320px;padding-bottom:6px}
.g-back{color:#4b5563;font-size:12px;text-decoration:none;transition:color .15s}
.g-back:hover{color:#9ca3af}
.g-login-btn{background:none;border:1px solid #374151;border-radius:8px;
  color:#9ca3af;font-size:11px;padding:5px 11px;cursor:pointer;transition:all .15s}
.g-login-btn:hover{border-color:#f59e0b;color:#f59e0b}
.g-user-chip{font-size:11px;color:#6b7280;background:#1f2937;
  border-radius:8px;padding:5px 10px;max-width:120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loadingScreen" class="screen">
  <div class="spin"></div>에셋 로딩 중...
</div>

<!-- 로비 -->
<div id="lobbyScreen" class="screen hidden">
  <div class="g-hdr">
    <a href="/merchants.html" class="g-back">← 게임으로</a>
    <div id="gHdrRight"><button class="g-login-btn" id="gLoginBtn">🔑 Google 로그인</button></div>
  </div>
  <div class="bow-title">🏹 활쏘기<br><span>Monster Hunt</span></div>
  <div style="font-size:12px;color:#9ca3af;text-align:center">1분 동안 몬스터를 최대한 많이 잡아라!</div>
  <div class="stat-card">
    <h3>내 정보</h3>
    <div class="sr"><span class="lbl">💰 GP</span><span class="val" id="lobbyGP">—</span></div>
  </div>
  <div class="badge" id="feeBadge">참가비: 100 GP</div>
  <div id="feeInfo" style="font-size:10px;color:#9ca3af;text-align:center">오늘 첫 참가 · 24시간 후 자동 리셋</div>
  <button class="btn-main" id="btnEnter">🏹 게임 시작</button>
  <div style="font-size:10.5px;color:#4b5563;text-align:center">500점→30GP · 1000→70GP · 2000→150GP · 4000→300GP</div>
  <div style="font-size:10px;color:#6b7280;text-align:center">⚠️ 화살 1발당 3점 감점 · 적중률이 관건!</div>
  <a href="/merchants.html" style="font-size:12px;color:#4b5563;text-decoration:none">← 게임으로</a>
</div>

<!-- 스킬 선택 -->
<div id="skillScreen" class="screen hidden">
  <h2>🎒 스킬 선택</h2>
  <div id="skCount" style="font-size:12px;color:#9ca3af">0/3 선택</div>
  <div id="skillGrid"></div>
  <button class="btn-main" id="skConfirm" disabled style="margin-top:4px">출발 →</button>
</div>

<!-- 카운트다운 -->
<div id="countdownScreen" class="screen hidden">
  <div style="font-size:13px;color:#9ca3af;margin-bottom:6px">활을 겨눠라!</div>
  <div id="cdNum">3</div>
  <div style="font-size:11px;color:#6b7280;margin-top:10px">🖱️ 클릭 / 📱 탭으로 화살 발사</div>
</div>

<!-- 게임 -->
<div id="gameScreen" class="screen hidden">
  <div id="canvasWrap">
    <canvas id="bowCanvas"></canvas>
    <button id="btnFs" title="전체 화면">⤢</button>
    <div id="hud">
      <div id="hudTop">
        <div class="hb" id="hpBox">❤️<div class="hp-bg"><div id="hpFill"></div></div></div>
        <div class="hb" id="scoreTxt">💰 0</div>
        <div class="hb" id="timerTxt">60</div>
        <div class="hb" id="mpBox">
          <div class="mp-row">
            <span>MP</span>
            <div class="mp-bg"><div id="mpFill"></div></div>
          </div>
        </div>
      </div>
      <div id="cannonWarning"></div>
      <div id="comboBox">
        <div id="comboNum">x2</div>
        <div id="comboLbl">COMBO</div>
      </div>
      <div id="skillBar"></div>
    </div>
  </div>
</div>

<!-- 결과 -->
<div id="resultScreen" class="screen hidden">
  <div class="g-hdr" style="margin-bottom:4px">
    <a href="/merchants.html" class="g-back">← 게임으로</a>
    <div id="gHdrRight2"></div>
  </div>
  <div class="res-title">🏹 사냥 완료!</div>
  <div id="resFinalScore">0점</div>
  <div id="resGP">+0 GP</div>
  <div id="resInfo"></div>
  <button class="btn-main" id="btnRestart" style="margin-top:16px">다시 도전!</button>
  <a href="/merchants.html" style="font-size:12px;color:#4b5563;text-decoration:none;margin-top:6px">← 게임으로</a>
</div>
