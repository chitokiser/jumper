<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문 및 구매 내역 | BestClub — My Orders</title>
  <meta name="description" content="BestClub 주문 및 구매 내역 — 공식 쇼핑몰 가맹점 상품 주문 및 결제 상태를 한눈에 확인하세요." />
  <meta property="og:title" content="주문 및 구매 내역 | BestClub" />
  <meta property="og:description" content="가맹점 상품 주문 및 결제 상태를 한눈에 확인하세요." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/pages/orders.css" />

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"></script>

  <script src="/assets/js/partials.js"></script>

  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/firestore-bridge.js"></script>

  <script type="module" src="/assets/js/pages/orders.js"></script>
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="hero hero--compact">
      <div class="hero-inner">
        <h1 class="hero-title">주문 및 구매 내역</h1>
        <p class="hero-sub">
          가맹점 매장/QR 결제 및 쇼핑몰 상품 구매 내역, 결제 상태를 한눈에 확인하세요.
        </p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-inner">

        <div class="tabs">
          <button class="tab tab--active" id="tabMerchantOrders" type="button">🛍️ 가맹점 주문·결제 내역</button>
          <button class="tab" id="tabCoop" type="button">멤버십 / 패키지</button>
          <button class="tab" id="tabOrders" type="button">일반 주문 (투어)</button>
          <button class="tab" id="tabReviews" type="button">내 작성 리뷰</button>
          <span class="tab-spacer"></span>
          <button class="btn btn-ghost" id="btnReload" type="button">🔄 새로고침</button>
        </div>

        <div id="state" class="state"></div>

        <div id="viewMerchantOrders">
          <div id="merchantOrdersList" class="list" style="display:flex; flex-direction:column; gap:16px;"></div>
        </div>

        <div id="viewCoop" class="hidden">
          <div id="coopOrdersList" class="list"></div>
        </div>

        <div id="viewOrders" class="hidden">
          <div id="ordersList" class="list"></div>
        </div>

        <div id="viewReviews" class="hidden">
          <div id="myReviewsList" class="list"></div>
        </div>

      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
</body>
</html>
