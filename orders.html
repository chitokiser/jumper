<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase History | K-CULTURE ALLIANCE — My Orders</title>
  <meta name="description" content="K-CULTURE ALLIANCE Purchase History — View member mall payments and general orders at a glance." />
  <meta property="og:title" content="Purchase History | K-CULTURE ALLIANCE" />
  <meta property="og:description" content="View member mall and general order purchase history." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"></script>

  <script src="/assets/js/partials.js"></script>

  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/firestore-bridge.js"></script>

  <script type="module" src="/assets/js/pages/orders.js"></script>
</head>

<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="hero hero--compact">
      <div class="hero-inner">
        <h1 class="hero-title">Purchase History</h1>
        <p class="hero-sub">
          View member mall payments and general orders at a glance.
        </p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-inner">

        <div class="tabs">
          <button class="tab tab--active" id="tabCoop" type="button">Member Mall</button>
          <button class="tab" id="tabOrders" type="button">General Orders</button>
          <button class="tab" id="tabReviews" type="button">My Reviews</button>
          <span class="tab-spacer"></span>
          <button class="btn btn-ghost" id="btnReload" type="button">Refresh</button>
        </div>

        <div id="state" class="state"></div>

        <div id="viewCoop">
          <div id="coopOrdersList" class="list"></div>
        </div>

        <div id="viewOrders" class="hidden">
          <div id="ordersList" class="list"></div>
        </div>

        <div id="viewReviews" class="hidden">
          <div id="myReviewsList" class="list"></div>
        </div>

      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
</body>
</html>
