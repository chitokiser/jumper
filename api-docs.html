<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-MOA Merchant API Guide</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- zero-md: A lightweight web component for rendering Markdown directly -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            color: #111827;
        }

        .docs-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 2rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* 
          Since zero-md utilizes Shadow DOM by default, 
          styles applied here won't leak inside the markdown component.
          However, zero-md provides its own beautiful GitHub-style markdown CSS. 
        */

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: #111827;
        }

        .brand span {
            color: #f43f5e;
        }

        .btn-home {
            background-color: #111827;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-home:hover {
            background-color: #374151;
        }

        @media (max-width: 768px) {
            .docs-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="docs-container">
        <div class="header-bar">
            <div class="brand">K-MOA <span>API Portal</span></div>
            <a href="/" class="btn-home">메인으로 가기</a>
        </div>

        <!-- Render the markdown file immediately! -->
        <zero-md src="KMOA_MERCHANT_API.md">
            <!-- Append custom CSS to the shadow DOM inside zero-md -->
            <template>
                <style>
                    /* Customizing Github Markdown Style inside zero-md */
                    .markdown-body {
                        font-family: 'Inter', sans-serif !important;
                        color: #374151;
                    }

                    .markdown-body h1 {
                        color: #111827;
                        border-bottom: 2px solid #f3f4f6;
                        padding-bottom: 0.5rem;
                    }

                    .markdown-body h2 {
                        color: #1f2937;
                        margin-top: 2rem;
                    }

                    .markdown-body pre {
                        background-color: #1e1e1e !important;
                        /* VSCode Dark like */
                        color: #d4d4d4 !important;
                        border-radius: 8px;
                    }

                    .markdown-body code {
                        background-color: #f3f4f6;
                        color: #f43f5e;
                    }
                </style>
            </template>
        </zero-md>
    </div>
</body>

</html>
