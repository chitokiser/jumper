<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/images/jump/favicon.png">
  <title>Our Town Details - Coming Soon</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />

  <script src="/assets/js/partials.js" defer></script>
  <script type="module" src="/assets/js/header-auth.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="panel">
      <h1 class="title">Our Town Details (Coming Soon)</h1>
      <p class="desc">
        Browse by Ocean Park 1/2/3
        Convenient living, transportation, recommended merchants, community hubs, homestay/things to do list.
      </p>
      <div class="state" id="areaState"></div>

      <div class="row" style="margin-top:14px; gap:10px; flex-wrap:wrap;">
        <a class="btn" href="/index.html">Back to Our Town</a>
        <a class="btn btn--ghost" href="/homestay.html">Homestay</a>
        <a class="btn btn--ghost" href="/what.html">What to Do?</a>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script>
    (function(){
      const p = new URLSearchParams(location.search);
      const area = (p.get('area') || '').toLowerCase();
      const map = { op1: 'Ocean Park 1', op2: 'Ocean Park 2', op3: 'Ocean Park 3' };
      const name = map[area] || 'Our Town';
      const el = document.getElementById('areaState');
      if(el) el.textContent = `Selected: ${name}`;
      document.title = `${name} - Our Town`;
    })();
  </script>
</body>
</html>
