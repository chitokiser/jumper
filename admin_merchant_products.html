<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가맹점 상품 관리 - BestERP</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <script src="/assets/js/partials.js" defer></script>
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="panel">
      <div class="panel-h" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <div class="panel-title">가맹점 상품 관리 (BestERP)</div>
          <div id="merchantInfoBadge" style="margin-top:4px; font-size:0.85rem; color:#64748b;">가맹점 계정 확인 중...</div>
        </div>
        <div class="panel-actions" style="display:flex; gap:8px;">
          <a href="/admin_merchant_orders.html" class="btn"
            style="text-decoration:none; background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe;">📋 주문 관리로 이동</a>
          <button class="btn btn--primary" id="btnCreateProduct" type="button">+ 상품 등록</button>
        </div>
      </div>

      <!-- 탭 및 가맹점 선택 필터 바 -->
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:16px; padding:12px 16px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0;">
        <div style="display:flex; gap:8px;">
          <button type="button" id="tabMerchantProducts" class="btn btn--sm btn--primary" style="font-weight:600;">📦 BestERP 상품 (카탈로그)</button>
          <button type="button" id="tabItemsProducts" class="btn btn--sm" style="background:#fff; color:#475569; border:1px solid #cbd5e1; font-weight:600;">🧳 기존 등록 상품/투어 (items)</button>
        </div>

        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600; color:#334155;">
            <span>🏪 가맹점:</span>
            <select id="filterMerchantSelect" class="input" style="padding:6px 10px; font-size:0.85rem; min-width:200px; background:#fff; border:1px solid #94a3b8; border-radius:6px; font-weight:bold;">
              <option value="all">== 전체 가맹점 (모든 상품) ==</option>
            </select>
          </label>

          <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600; color:#334155;">
            <span>상태:</span>
            <select id="filterStatusSelect" class="input" style="padding:6px 10px; font-size:0.85rem; background:#fff; border:1px solid #cbd5e1; border-radius:6px;">
              <option value="all">전체 상태</option>
              <option value="published">판매 공개중</option>
              <option value="draft">임시저장 (비공개)</option>
              <option value="sold_out">품절</option>
            </select>
          </label>

          <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600; color:#334155;">
            <span>정렬:</span>
            <select id="sortSelect" class="input" style="padding:6px 10px; font-size:0.85rem; background:#fff; border:1px solid #cbd5e1; border-radius:6px;">
              <option value="new">최신 등록순</option>
              <option value="name">이름순</option>
              <option value="price_asc">낮은 가격순</option>
              <option value="price_desc">높은 가격순</option>
              <option value="gb">공구·타임딜 먼저</option>
            </select>
          </label>
        </div>
        <input id="productSearch" type="search" class="input" placeholder="🔍 상품명·설명 검색" autocomplete="off"
          style="flex:1 1 220px; min-width:200px; padding:7px 12px; font-size:0.88rem; border:1px solid #cbd5e1; border-radius:8px; background:#fff;" />
      </div>

      <div id="productStatsSummary" style="margin-top:12px; font-size:0.85rem; color:#64748b; font-weight:500;"></div>
      <div id="productState" class="state" style="padding: 20px; font-weight: bold;">조회 중...</div>
      <style>
        /* 상품 카드 그리드 (2026-11-26 UI 정리): 화면 너비에 맞춰 여러 열, 이미지 전체가 보이게 */
        #productList.pg-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top:16px; }
        .pg-card { position:relative; display:flex; flex-direction:column; background:#fff; border:1px solid #e2e8f0; border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,0.05); transition:box-shadow .15s, transform .15s; }
        .pg-card:hover { box-shadow:0 8px 20px rgba(15,23,42,0.09); transform:translateY(-1px); }
        .pg-card.is-gb { border:2px solid #fb7185; }
        .pg-card.is-off .pg-thumb img { filter:grayscale(.6); opacity:.75; }
        .pg-thumb { position:relative; height:0; padding-top:75%; background:#f8fafc; overflow:hidden; border-bottom:1px solid #f1f5f9; }
        .pg-thumb img { position:absolute; inset:0; width:100% !important; height:100% !important; max-width:none; object-fit:contain; padding:8px; box-sizing:border-box; }
        .pg-thumb .pg-noimg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
        .pg-thumb .pg-noimg { font-size:2.2rem; color:#cbd5e1; }
        .pg-status { position:absolute; top:8px; left:8px; font-size:0.7rem; font-weight:800; padding:3px 8px; border-radius:99px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
        .pg-gb { position:absolute; top:8px; right:8px; font-size:0.68rem; font-weight:800; padding:3px 7px; border-radius:99px; background:#fff1f2; color:#e11d48; border:1px solid #fecdd3; }
        .pg-body { padding:10px 12px 8px; display:flex; flex-direction:column; gap:4px; flex:1; }
        .pg-merchant { font-size:0.7rem; font-weight:700; color:#1e40af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .pg-name { font-size:0.92rem; font-weight:800; color:#0f172a; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
        .pg-meta { font-size:0.72rem; color:#64748b; }
        .pg-price { font-size:1.02rem; font-weight:900; color:#0f766e; margin-top:2px; }
        .pg-bonus { font-size:0.7rem; font-weight:700; color:#d97706; }
        .pg-desc { font-size:0.74rem; color:#64748b; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .pg-actions { display:flex; gap:6px; padding:8px 10px 10px; border-top:1px solid #f1f5f9; }
        .pg-actions .btn { padding:6px 8px !important; font-size:0.76rem !important; border-radius:8px !important; white-space:nowrap; }
        .pg-actions .pg-grow { flex:1; }
        .pg-more { grid-column:1/-1; display:flex; justify-content:center; padding:6px 0 4px; }
        @media (max-width:520px) { #productList.pg-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; } .pg-desc { display:none; } .pg-actions { flex-wrap:wrap; } }
      </style>
      <div id="productList" class="pg-grid"></div>
    </section>

    <!-- 상품 등록/수정 모달 -->
    <div id="productModal" class="modal"
      style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 12px; box-sizing: border-box;">
      <div class="modal-content panel" style="background:#fff; width:100%; max-width:540px; max-height:calc(100vh - 48px); overflow-y:auto; padding: 20px; border-radius:14px; margin: auto; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.25);">
        <div style="display:flex; justify-content:space-between; align-items:center; position:sticky; top:-20px; background:#fff; padding:4px 0 12px; margin-bottom:8px; border-bottom:1px solid #f1f5f9; z-index:2;">
          <h3 id="modalTitle" style="margin:0;">상품 등록</h3>
          <button type="button" onclick="document.getElementById('productModal').style.display='none'" style="border:none; background:#f1f5f9; color:#475569; width:32px; height:32px; border-radius:99px; cursor:pointer; font-weight:800; font-size:1rem;">✕</button>
        </div>
        <form id="productForm" style="display:grid;gap:12px;">

          <div id="adminMerchantRow" style="display:none;">
            <label>
              <div class="muted" style="color:#ef4444;font-weight:bold;">가맹점 선택 (수퍼관리자 전용)</div>
              <select id="pMerchantId" class="input"
                style="width:100%; border:1px solid #ef4444; padding:8px; background:#fff5f5;">
                <option value="">= 가맹점 불러오는 중... =</option>
              </select>
            </label>
          </div>
          <label>
            <div class="muted">상품분류</div>

            <select id="pType" class="input" style="width:100%; border:1px solid #ccc; padding:8px;">
              <option value="physical_product">일반 실물 상품</option>
              <option value="menu">메뉴 (음식)</option>
              <option value="service">서비스</option>
              <option value="booking">예약형</option>
            </select>
          </label>
          <label>
            <div class="muted">상품 이름</div><input id="pName" class="input"
              style="width:100%; border:1px solid #ccc; padding:8px;" required />
          </label>
          <label>
            <div class="muted">대표 이미지 URL (선택)</div><input id="pImg" type="url" class="input"
              style="width:100%; border:1px solid #ccc; padding:8px;" placeholder="https://..." />
          </label>
          <label>
            <div class="muted">설명</div><textarea id="pDesc" class="textarea" rows="3"
              style="width:100%; border:1px solid #ccc; padding:8px;"></textarea>
          </label>
          <label>
            <div class="muted">가격 (VND, 공구 사용 시 타임딜 즉시 할인가)</div><input id="pPrice" type="number" class="input"
              style="width:100%; border:1px solid #ccc; padding:8px;" required />
          </label>
          <label>
            <div class="muted">상태</div>
            <select id="pStatus" class="input" style="width:100%; border:1px solid #ccc; padding:8px;">
              <option value="draft">임시저장 (비공개)</option>
              <option value="published">판매 공개 (홈페이지 즉시 노출)</option>
              <option value="sold_out">품절</option>
            </select>
          </label>

          <!-- 🔥 하노이 교민 공동구매(Group Buy) & 타임딜 설정 -->
          <div style="border:1px solid #fecdd3; background:#fff1f2; border-radius:10px; padding:12px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:8px; font-weight:800; color:#be123c; cursor:pointer;">
              <input type="checkbox" id="pGbEnabled" style="width:16px; height:16px;" />
              <span>🔥 하노이 교민 공동구매 &amp; 타임딜 적용</span>
            </label>
            <div id="gbConfigFields" style="display:none; margin-top:10px; display:grid; gap:8px; font-size:0.84rem;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label>
                  <div class="muted" style="font-size:0.78rem;">공구 진행 방식</div>
                  <select id="pGbMode" class="input" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;">
                    <option value="team_recruit">📦 뭉쳐야 산다 (판매수량 달성형)</option>
                    <option value="weekly_cycle">🥬 주간 정기공구 (반찬·식자재)</option>
                  </select>
                </label>
                <label>
                  <div class="muted" style="font-size:0.78rem;">하노이 권역</div>
                  <select id="pGbRegion" class="input" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;">
                    <option value="미딩·하동·서호 전지역">하노이 전지역</option>
                    <option value="미딩·쭝화">미딩·쭝화</option>
                    <option value="하동·반푹">하동·반푹</option>
                    <option value="서호·외교단지">서호·외교단지</option>
                    <option value="타임시티·오션파크">타임시티·오션파크</option>
                  </select>
                </label>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label>
                  <div class="muted" style="font-size:0.78rem;">정상가 (할인 전, VND)</div>
                  <input id="pGbOriginalPrice" type="number" class="input" placeholder="예: 350000" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
                </label>
                <label>
                  <div class="muted" style="font-size:0.78rem;">목표 달성 추가 BM 보너스</div>
                  <input id="pGbBonusBm" type="number" class="input" placeholder="예: 20000" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
                </label>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <label>
                  <div class="muted" style="font-size:0.78rem;">보너스 목표 판매 수량(개)</div>
                  <input id="pGbTargetCount" type="number" class="input" value="10" min="2" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
                </label>
                <label>
                  <div class="muted" style="font-size:0.78rem;">현재 누적 판매 수량(개)</div>
                  <input id="pGbCurrentCount" type="number" class="input" value="0" min="0" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
                </label>
              </div>
              <label>
                <div class="muted" style="font-size:0.78rem;">타임딜 마감 일시 (비워두면 주간 목요일 18시 자동)</div>
                <input id="pGbDeadline" type="datetime-local" class="input" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
              </label>
              <label>
                <div class="muted" style="font-size:0.78rem;">배송/수령 및 공구 안내 문구</div>
                <input id="pGbDeliveryNote" type="text" class="input" placeholder="예: 타임딜 주문 즉시 할인가 확정 · 목요일 마감 금요일 일괄 배송" style="width:100%; border:1px solid #fda4af; padding:6px; background:#fff;" />
              </label>
            </div>
          </div>

          <div style="display:flex;gap:8px;margin-top:8px;padding:12px 0 2px;border-top:1px solid #f1f5f9;justify-content:space-between;align-items:center;position:sticky;bottom:-20px;background:#fff;z-index:2;">
            <button type="button" class="btn" id="btnDeleteInModal"
              style="display:none; background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; font-weight:600;">🗑️ 상품
              삭제</button>
            <div style="display:flex;gap:8px;margin-left:auto;">
              <button type="button" class="btn" id="btnCloseModal">취소</button>
              <button type="submit" class="btn btn--primary" id="btnSaveProduct">저장</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script type="module" src="/assets/js/pages/admin_merchant_products.js"></script>
</body>

</html>
