<html><body><h1>Wiping users...</h1><script type='module'>import { db, auth } from './assets/js/firebase-init.js'; import { collection, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js'; import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'; onAuthStateChanged(auth, async (u) => { if(u && (u.email||'').toLowerCase() === 'daguri75@gmail.com') { const s = await getDocs(collection(db, 'users')); let c = 0; for(let d of s.docs) { if(d.id !== u.uid && d.data().email !== 'daguri75@gmail.com') { await deleteDoc(d.ref); c++; } } document.body.innerHTML = '<h2>Wiped ' + c + ' users! Test clean!</h2>'; } }); </script></body></html>
