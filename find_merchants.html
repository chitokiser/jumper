<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가맹점 찾기 | K-MOA</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <style>
    .mc-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 12px 48px;
    }

    .mc-hd {
      padding: 18px 0 12px;
    }

    .mc-hd h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .mc-hd p {
      font-size: 13px;
      color: #888;
      margin: 0;
    }

    .mc-map-wrap {
      position: relative;
      height: 420px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      margin-bottom: 16px;
      background: #f3f4f6;
    }

    #merchantMap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #888;
    }

    .mc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 10px;
    }

    .mc-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 16px;
      padding: 0;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .mc-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
      border-color: rgba(245, 158, 11, 0.3);
    }
    
    .mc-card-inner {
      padding: 24px;
      position: relative;
    }

    .mc-card-header-inner {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .mc-card-logo {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .mc-card-name {
      font-weight: 800;
      font-size: 1.15rem;
      color: #0f172a;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .mc-card-career {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f59e0b;
    }

    .mc-card-region {
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      margin-left: 6px;
    }

    .mc-card-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #b45309;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 4px rgba(245,158,11,0.2);
    }

    .mc-card-stats {
      display: flex;
      gap: 12px;
      margin: 16px 0;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .mc-card-info-row {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mc-card-desc {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: auto;
    }

    .mc-card-footer {
      border-top: 1px solid #f1f5f9;
      margin-top: 14px;
      padding-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .mc-link-btn {
      color: #2563eb;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }
    .mc-link-btn:hover {
      color: #1e40af;
      text-decoration: underline;
    }
  </style>
  <script src="/assets/js/partials.js" defer></script>
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/header-auth.js"></script>
  <script type="module" src="/assets/js/pages/find_merchants.js"></script>
<link rel='manifest' href='/manifest.json'>
</head>
