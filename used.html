<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>중고거래 - BestCluber</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <link rel="stylesheet" href="/assets/css/pages/used_market.css" />

  <script src="/assets/js/partials.js" defer></script>
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/header-auth.js"></script>
  <script type="module" src="/assets/js/pages/used_market.js" defer></script>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="um-head">
      <div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <h1 class="title" style="margin-bottom:4px;">회원간 중고거래</h1>
          <span id="umAdminBadge" style="display:none; align-items:center; gap:4px; font-size:12px; font-weight:700; color:#1d4ed8; background:#eff6ff; border:1px solid #bfdbfe; padding:3px 10px; border-radius:999px;">🛡️ 수퍼어드민 모드</span>
        </div>
        <p class="desc" style="margin-bottom:0;">당근처럼 지역 기반으로 물건을 사고팔 수 있어요.</p>
      </div>
      <a class="btn btn--primary" href="/used-market-new.html">판매글 등록</a>
    </section>

    <section class="panel" style="margin-top:12px;">
      <div class="um-tools">
        <input id="umSearch" class="input" placeholder="검색어 (제목/설명/지역/판매자)" />
        <select id="umStatus" class="select">
          <option value="all">전체 상태</option>
          <option value="on_sale">판매중</option>
          <option value="reserved">예약중</option>
          <option value="sold">판매완료</option>
          <option value="hidden" id="umOptHidden" style="display:none;">숨김 (hidden)</option>
        </select>
      </div>

      <div id="umState" class="state">불러오는 중...</div>
      <div id="umGrid" class="um-grid"></div>
    </section>
  </main>

  <!-- 수퍼어드민 상품 수정/보완 모달 -->
  <div id="umAdminModal" class="um-modal" style="display:none;">
    <div class="um-modal-overlay" id="umAdminModalOverlay"></div>
    <div class="um-modal-card">
      <div class="um-modal-header">
        <h3 style="margin:0; font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:6px;">
          <span>🛡️</span> <span>상품 수정 및 보완 (수퍼어드민)</span>
        </h3>
        <button type="button" class="um-modal-close" id="btnAdminModalClose" aria-label="닫기">&times;</button>
      </div>

      <form id="umAdminEditForm" class="um-modal-body">
        <input type="hidden" id="mEditId" />

        <div class="um-form-row">
          <label class="um-label" for="mEditStatus">판매 상태</label>
          <select id="mEditStatus" class="select" style="width:100%; font-weight:700;">
            <option value="on_sale">🟢 판매중 (on_sale)</option>
            <option value="reserved">🟡 예약중 (reserved)</option>
            <option value="sold">⚪ 판매완료 (sold)</option>
            <option value="hidden">🔴 숨김 / 블라인드 (hidden)</option>
          </select>
        </div>

        <div class="um-form-row">
          <label class="um-label" for="mEditTitle">상품명 (제목)</label>
          <input id="mEditTitle" class="input" style="width:100%;" required maxlength="80" placeholder="상품명 입력" />
        </div>

        <div class="um-form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label class="um-label" for="mEditPrice">가격 (원)</label>
            <input id="mEditPrice" class="input" type="number" min="0" step="1000" style="width:100%;" required placeholder="0" />
          </div>
          <div>
            <label class="um-label" for="mEditRegion">거래 지역</label>
            <input id="mEditRegion" class="input" style="width:100%;" maxlength="40" required placeholder="예: 하노이 미딩" />
          </div>
        </div>

        <div class="um-form-row">
          <label class="um-label" for="mEditContact">판매자 연락처</label>
          <input id="mEditContact" class="input" style="width:100%;" maxlength="80" required placeholder="카카오톡 / 전화번호 등" />
        </div>

        <div class="um-form-row" id="mSellerInfoRow" style="font-size:12px; color:var(--muted); background:#f8fafc; padding:8px 10px; border-radius:8px; border:1px solid var(--line2);">
          <div>판매자: <strong id="mSellerName">-</strong> (<span id="mSellerEmail">-</span>)</div>
          <div style="font-family:monospace; margin-top:2px;">UID: <span id="mSellerUid">-</span></div>
        </div>

        <div class="um-form-row">
          <label class="um-label">상품 사진 (최대 4장)</label>
          <div style="display:grid; gap:6px;">
            <input id="mEditImg1" class="input" placeholder="대표 이미지 URL 1" />
            <input id="mEditImg2" class="input" placeholder="추가 이미지 URL 2" />
            <input id="mEditImg3" class="input" placeholder="추가 이미지 URL 3" />
            <input id="mEditImg4" class="input" placeholder="추가 이미지 URL 4" />
          </div>
          <div style="margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <label class="btn btn--sm" style="cursor:pointer; display:inline-flex; align-items:center; gap:4px; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:6px 12px; font-weight:600;">
              📷 내 기기에서 새 사진 업로드
              <input id="mEditFileImages" type="file" accept="image/*" multiple style="display:none;" />
            </label>
            <span id="mEditUploadStatus" style="font-size:12px; color:#2563eb;"></span>
          </div>
          <div id="mEditImgPreviews" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;"></div>
        </div>

        <div class="um-form-row">
          <label class="um-label" for="mEditDesc">상품 상세 설명 및 보완 내용</label>
          <textarea id="mEditDesc" class="textarea" rows="6" maxlength="3000" style="width:100%; resize:vertical;" required placeholder="상품에 대한 상태, 거래 조건 등 상세 설명"></textarea>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn" id="btnAdminModalDelete" style="background:#fee2e2; color:#ef4444; border:1px solid #fca5a5; font-weight:700;">
            🗑️ 상품 삭제
          </button>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn" id="btnAdminModalCancel">취소</button>
            <button type="submit" class="btn btn--primary" id="btnAdminModalSave" style="font-weight:700;">
              💾 수정 저장
            </button>
          </div>
        </div>
        <div id="mAdminModalMsg" style="margin-top:8px; font-size:13px; text-align:right;"></div>
      </form>
    </div>
  </div>

  <div id="umToast" class="um-toast"></div>

  <div id="siteFooter"></div>
</body>
</html>
