[build]
  publish = "."

# ── 전역 보안 헤더 ────────────────────────────────────────────────────────────
# X-Frame-Options 는 전역 적용하지 않음 — Telegram Mini App 페이지별 CSP로 제어
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# ── Telegram Mini App 허용 페이지 ─────────────────────────────────────────────
# CSP frame-ancestors 로 Telegram Web 허용, X-Frame-Options 는 설정 안 함
[[headers]]
  for = "/telegram.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://k.me https://a.telegram.org"

[[headers]]
  for = "/tg-hub.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://k.me https://a.telegram.org"

[[headers]]
  for = "/merchants.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://k.me https://a.telegram.org"

[[headers]]
  for = "/bow.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://k.me https://a.telegram.org"

[[headers]]
  for = "/monsterrace.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://k.me https://a.telegram.org"

