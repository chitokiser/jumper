<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/images/jump/favicon.png" />
  <title>보물찾기 — Find the Hidden Treasure</title>
  <meta name="description" content="NPC 힌트를 따라 숨겨진 보물을 찾고 몬스터를 처치하여 열쇠를 획득하세요. The adventure is calling. The treasure is real." />
  <meta property="og:image" content="https://jump22.netlify.app/assets/images/ui/map.png" />

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel Decorative (fantasy headings) + Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/header.css" />
  <style>
    /* ── Base ──────────────────────────────────────────────────────────── */
    body { font-family: 'Noto Sans KR', sans-serif; background: #080614; color: #fff; }
    /* 헤더 다크 오버라이드 */
    .top-header { --hdr-fill: rgba(8,6,20,.85); --hdr-fill-2: rgba(8,6,20,.92); --hdr-text: #fde68a; --hdr-text-2: #f59e0b; --hdr-line: rgba(245,158,11,.2); }
    .font-fantasy  { font-family: 'Cinzel Decorative', serif; }
    .font-cinzel   { font-family: 'Cinzel', serif; }

    /* ── Gold gradient text ──────────────────────────────────────────── */
    .text-gold {
      background: linear-gradient(135deg, #c8922a 0%, #fde68a 40%, #f59e0b 70%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Shimmer button ──────────────────────────────────────────────── */
    .btn-gold {
      background: linear-gradient(90deg, #92400e, #f59e0b, #fde68a, #f59e0b, #92400e);
      background-size: 250% 100%;
      animation: shimmer 3s linear infinite;
      color: #1c0f00;
      font-weight: 700;
      font-family: 'Cinzel', serif;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 0; }
      100% { background-position: 250% 0; }
    }

    /* ── Floating animation ──────────────────────────────────────────── */
    .float-anim { animation: float 5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ── Glow pulse ──────────────────────────────────────────────────── */
    .glow-gold { animation: glow 3s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 24px rgba(245,158,11,.35), 0 0 60px rgba(245,158,11,.12); }
      50%       { box-shadow: 0 0 48px rgba(245,158,11,.65), 0 0 120px rgba(245,158,11,.25); }
    }

    /* ── Sparkle dots ────────────────────────────────────────────────── */
    .sparkle { position: absolute; border-radius: 50%; background: #fde68a; animation: spark 4s ease-in-out infinite; pointer-events: none; }
    @keyframes spark {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50%       { opacity: .9; transform: scale(1) rotate(180deg); }
    }

    /* ── Star twinkle ────────────────────────────────────────────────── */
    .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: .1; } 50% { opacity: .8; }
    }

    /* ── Scroll fade-in ──────────────────────────────────────────────── */
    .fade-in { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ── Card hover ──────────────────────────────────────────────────── */
    .card-hover { transition: transform .3s ease, box-shadow .3s ease; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(245,158,11,.22); }

    /* ── Divider ─────────────────────────────────────────────────────── */
    .divider { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(245,158,11,.5), transparent); margin: 0 40px; }

    /* ── Hero BG ─────────────────────────────────────────────────────── */
    .hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(245,158,11,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(120,40,0,.25) 0%, transparent 60%),
        linear-gradient(180deg, #080614 0%, #12082a 50%, #080614 100%);
    }

    /* ── Stats ───────────────────────────────────────────────────────── */
    .stat-num { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 700; }

    /* ── Reward badge ────────────────────────────────────────────────── */
    .reward-badge {
      position: absolute; top: -10px; right: -10px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      font-size: .6rem; font-family: 'Cinzel', serif;
      padding: 3px 8px; border-radius: 999px; letter-spacing: .08em;
    }

    /* ── Parchment texture on map ────────────────────────────────────── */
    .map-frame {
      border: 2px solid rgba(245,158,11,.4);
      border-radius: 16px;
      box-shadow: inset 0 0 60px rgba(0,0,0,.5), 0 0 0 1px rgba(245,158,11,.15);
    }
  </style>
</head>

<body class="hero-bg min-h-screen">

  <div id="siteHeader"></div>
  <script src="/assets/js/partials.js" defer></script>

  <!-- ═══════════════════════════════════════════════════════════════════
       SECTION 1 — HERO
  ═══════════════════════════════════════════════════════════════════════ -->
  <section class="relative min-h-screen flex flex-col items-center justify-center px-4 pt-20 pb-12 overflow-hidden">

    <!-- Background stars -->

      <div class="star" style="top:15%;left:73%;animation-delay:.9s"></div>
      <div class="star" style="top:25%;left:42%;animation-delay:1.7s"></div>
      <div class="star" style="top:35%;left:88%;animation-delay:.5s"></div>
      <div class="star" style="top:55%;left:5%;animation-delay:2.1s"></div>
      <div class="star" style="top:70%;left:60%;animation-delay:1.3s"></div>
      <div class="star" style="top:80%;left:25%;animation-delay:.7s"></div>
      <div class="star" style="top:90%;left:82%;animation-delay:2.4s"></div>
      <div class="sparkle" style="width:7px;height:7px;top:18%;left:8%;animation-delay:0s"></div>
      <div class="sparkle" style="width:5px;height:5px;top:45%;left:92%;animation-delay:1.2s"></div>
      <div class="sparkle" style="width:8px;height:8px;top:72%;left:14%;animation-delay:2.3s"></div>
      <div class="sparkle" style="width:6px;height:6px;top:30%;left:78%;animation-delay:.6s"></div>
    </div>

    <!-- Badge -->
    <div class="relative z-10 mb-5 flex items-center gap-2 fade-in" style="transition-delay:.1s">
      <span class="text-yellow-500/60 text-base">⚔️</span>

      <span class="text-yellow-500/60 text-base">⚔️</span>
    </div>

    <!-- Title -->

    </div>

    <!-- Description -->

    <!-- MAP IMAGE -->
    <div class="relative z-10 w-full max-w-xl mx-auto mb-10 float-anim fade-in" style="transition-delay:.35s">
      <div class="map-frame glow-gold overflow-hidden">
        <img src="/assets/images/ui/map.png" alt="Treasure Map" class="w-full h-auto object-cover block" loading="eager" />
      </div>
      <!-- Corner emojis -->

    </div>

    <!-- Stats bar -->

      <div class="text-center">
        <div id="stat-users" class="stat-num text-gold">—</div>
        <div class="text-amber-200/50 text-xs font-cinzel tracking-wider" data-i18n="stat1"></div>
      </div>

      <div class="text-center">
        <div id="stat-treasure" class="stat-num text-gold">—</div>

        <div class="stat-num text-gold">∞</div>
        <div class="text-amber-200/50 text-xs font-cinzel tracking-wider" data-i18n="stat3"></div>

    </div>

    <!-- CTA Buttons -->
    <div class="relative z-10 flex flex-col sm:flex-row gap-3 w-full max-w-sm mx-auto fade-in" style="transition-delay:.45s">

    <!-- AR Scan -->
    <a href="/ar-scan.html" class="relative z-10 mt-5 flex items-center gap-2 justify-center px-8 py-3 rounded-2xl border border-amber-500/50 bg-amber-900/20 hover:bg-amber-800/35 text-amber-300 text-sm font-bold transition-all hover:scale-105 active:scale-95 fade-in" style="transition-delay:.5s">
      📷 AR Treasure Scanner

  <hr class="divider" />

  <!-- ═══════════════════════════════════════════════════════════════════
       SECTION 2 — HOW TO PLAY
  ═══════════════════════════════════════════════════════════════════════ -->
  <section class="py-20 px-4 max-w-4xl mx-auto">
    <div class="text-center mb-12 fade-in">
      <div class="font-cinzel text-yellow-500/50 text-xs tracking-[.3em] uppercase mb-3" data-i18n="how_eyebrow"></div>

      <p class="text-amber-200/50 text-sm mt-3" data-i18n="how_sub"></p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-4 gap-5">
      <!-- Step 1: AR 스캐너 실행 -->
      <div class="card-hover fade-in relative bg-white/[.04] border border-yellow-500/15 rounded-2xl p-6 text-center backdrop-blur-sm">
        <div class="absolute inset-0 rounded-2xl bg-gradient-to-b from-yellow-500/5 to-transparent pointer-events-none"></div>
        <div class="text-4xl mb-4">📷</div>
        <div class="font-cinzel text-yellow-500/60 text-[.65rem] tracking-[.3em] uppercase mb-2" data-i18n="step1_label"></div>

        <p class="text-amber-200/55 text-xs leading-relaxed" data-i18n="step1_desc"></p>
      </div>
      <!-- Step 2: 접근 후 획득 -->

        <div class="absolute inset-0 rounded-2xl bg-gradient-to-b from-yellow-500/5 to-transparent pointer-events-none"></div>
        <div class="hidden sm:block absolute -left-4 top-1/2 -translate-y-1/2 text-yellow-500/30 text-xl">›</div>
        <div class="text-4xl mb-4">🎯</div>
        <div class="font-cinzel text-yellow-500/60 text-[.65rem] tracking-[.3em] uppercase mb-2" data-i18n="step2_label"></div>
        <h3 class="font-bold text-white text-sm mb-2" data-i18n="step2_title"></h3>
        <p class="text-amber-200/55 text-xs leading-relaxed" data-i18n="step2_desc"></p>
      </div>
      <!-- Step 3: 몬스터 처치 → 열쇠 (숨김 박스) -->
      <div class="card-hover fade-in relative bg-white/[.04] border border-yellow-500/15 rounded-2xl p-6 text-center backdrop-blur-sm" style="transition-delay:.16s">
        <div class="absolute inset-0 rounded-2xl bg-gradient-to-b from-yellow-500/5 to-transparent pointer-events-none"></div>
        <div class="hidden sm:block absolute -left-4 top-1/2 -translate-y-1/2 text-yellow-500/30 text-xl">›</div>
        <div class="text-4xl mb-4">🗝️</div>
        <div class="font-cinzel text-yellow-500/60 text-[.65rem] tracking-[.3em] uppercase mb-2" data-i18n="step3_label"></div>
        <h3 class="font-bold text-white text-sm mb-2" data-i18n="step3_title"></h3>
        <p class="text-amber-200/55 text-xs leading-relaxed" data-i18n="step3_desc"></p>
      </div>
      <!-- Step 4: 인벤토리에서 박스 개봉 → 경품 -->
      <div class="card-hover fade-in relative bg-gradient-to-b from-emerald-500/8 to-transparent border border-emerald-500/25 rounded-2xl p-6 text-center backdrop-blur-sm" style="transition-delay:.24s">

        <div class="text-4xl mb-4">🎁</div>
        <div class="font-cinzel text-emerald-400/60 text-[.65rem] tracking-[.3em] uppercase mb-2" data-i18n="step4_label"></div>
        <h3 class="font-bold text-white text-sm mb-2" data-i18n="step4_title"></h3>
        <p class="text-amber-200/55 text-xs leading-relaxed" data-i18n="step4_desc"></p>
      </div>
    </div>
  </section>

  <!-- ── 관광지 특별 구역 배너 ────────────────────────────────────────────── -->

    </div>
  </section>

  <hr class="divider" />

  <!-- ═══════════════════════════════════════════════════════════════════

  ═══════════════════════════════════════════════════════════════════════ -->

        <div class="flex flex-col items-center gap-1 bg-white/5 rounded-xl px-4 py-3">

          <span class="text-amber-200/70 font-cinzel" data-i18n="prize_flow2"></span>
        </div>

        <li class="flex gap-2"><span class="text-amber-400 shrink-0">✦</span><span data-i18n="prize_note1"></span></li>
        <li class="flex gap-2"><span class="text-amber-400 shrink-0">✦</span><span data-i18n="prize_note2"></span></li>
        <li class="flex gap-2"><span class="text-amber-400 shrink-0">✦</span><span data-i18n="prize_note3"></span></li>

  <hr class="divider" />

  <!-- ═══════════════════════════════════════════════════════════════════

  ═══════════════════════════════════════════════════════════════════════ -->
  <section class="py-20 px-4 max-w-4xl mx-auto">

  <hr class="divider" />

  <!-- ═══════════════════════════════════════════════════════════════════
       SECTION 5 — FINAL CTA
  ═══════════════════════════════════════════════════════════════════════ -->
  <section class="py-24 px-4 text-center relative overflow-hidden fade-in">
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true"
      style="background: radial-gradient(ellipse 70% 60% at 50% 100%, rgba(245,158,11,.12) 0%, transparent 70%)"></div>

    <div class="relative z-10">
      <div class="text-5xl mb-5">🏴‍☠️</div>
      <h2 class="font-fantasy text-gold text-3xl sm:text-4xl md:text-5xl mb-4" data-i18n="cta_title"></h2>

      reward2_desc:    { ko: '온체인 HEX 포인트 즉시 지급', en: 'On-chain HEX points delivered instantly', vi: 'Điểm HEX on-chain được trao ngay lập tức' },
      reward3_name:    { ko: '전투 아이템', en: 'Battle Items', vi: 'Vật phẩm chiến đấu' },

      // Footer nav
      nav_merchants:   { ko: '가맹점', en: 'Merchants', vi: 'Cửa hàng' },

      nav_wallet:      { ko: '내 지갑', en: 'My Wallet', vi: 'Ví của tôi' },
    };

    const LANGS = ['ko', 'en', 'vi'];
    let lang = localStorage.getItem('town_lang') || 'en';

    function _t(key) {
      const e = MESSAGES[key];
      if (!e) return key;
      return e[lang] ?? e['ko'] ?? key;
    }

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = _t(el.dataset.i18n);
      });
      document.documentElement.lang = lang;
    }

    // 헤더 lang:change 이벤트와 동기화
    window.addEventListener('lang:change', function(e) {
      const newLang = e.detail && e.detail.lang;
      if (newLang && LANGS.includes(newLang)) {
        lang = newLang;
        applyLang();
      }
    });

    // ── Scroll fade-in ────────────────────────────────────────────────────────
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));

    // ── Init ──────────────────────────────────────────────────────────────────
    applyLang();

</body>
