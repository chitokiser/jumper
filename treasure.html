  <!-- Google Fonts: Cinzel Decorative (fantasy headings) + Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Base ──────────────────────────────────────────────────────────── */
    body { font-family: 'Noto Sans KR', sans-serif; background: #080614; color: #fff; }
    .font-fantasy  { font-family: 'Cinzel Decorative', serif; }
    .font-cinzel   { font-family: 'Cinzel', serif; }

    /* ── Gold gradient text ──────────────────────────────────────────── */
    .text-gold {
      background: linear-gradient(135deg, #c8922a 0%, #fde68a 40%, #f59e0b 70%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Shimmer button ──────────────────────────────────────────────── */
    .btn-gold {
      background: linear-gradient(90deg, #92400e, #f59e0b, #fde68a, #f59e0b, #92400e);
      background-size: 250% 100%;
      animation: shimmer 3s linear infinite;
      color: #1c0f00;
      font-weight: 700;
      font-family: 'Cinzel', serif;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 0; }
      100% { background-position: 250% 0; }
    }

    /* ── Floating animation ──────────────────────────────────────────── */
    .float-anim { animation: float 5s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* ── Glow pulse ──────────────────────────────────────────────────── */
    .glow-gold { animation: glow 3s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 24px rgba(245,158,11,.35), 0 0 60px rgba(245,158,11,.12); }
      50%       { box-shadow: 0 0 48px rgba(245,158,11,.65), 0 0 120px rgba(245,158,11,.25); }
    }

    /* ── Sparkle dots ────────────────────────────────────────────────── */
    .sparkle { position: absolute; border-radius: 50%; background: #fde68a; animation: spark 4s ease-in-out infinite; pointer-events: none; }
    @keyframes spark {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50%       { opacity: .9; transform: scale(1) rotate(180deg); }
    }

    /* ── Star twinkle ────────────────────────────────────────────────── */
    .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: .1; } 50% { opacity: .8; }
    }

    /* ── Scroll fade-in ──────────────────────────────────────────────── */
    .fade-in { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ── Card hover ──────────────────────────────────────────────────── */
    .card-hover { transition: transform .3s ease, box-shadow .3s ease; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(245,158,11,.22); }

    /* ── Divider ─────────────────────────────────────────────────────── */
    .divider { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(245,158,11,.5), transparent); margin: 0 40px; }

    /* ── Lang switcher ───────────────────────────────────────────────── */
    .lang-btn { border: 1px solid rgba(245,158,11,.4); color: rgba(253,230,138,.7); font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .05em; transition: all .2s; }
    .lang-btn:hover, .lang-btn.active { background: #f59e0b; color: #1c0f00; border-color: #f59e0b; font-weight: 700; }

    /* ── Hero BG ─────────────────────────────────────────────────────── */
    .hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(245,158,11,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(120,40,0,.25) 0%, transparent 60%),
        linear-gradient(180deg, #080614 0%, #12082a 50%, #080614 100%);
    }

    /* ── Stats ───────────────────────────────────────────────────────── */
    .stat-num { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 700; }

    /* ── Reward badge ────────────────────────────────────────────────── */
    .reward-badge {
      position: absolute; top: -10px; right: -10px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      font-size: .6rem; font-family: 'Cinzel', serif;
      padding: 3px 8px; border-radius: 999px; letter-spacing: .08em;
    }

    /* ── Parchment texture on map ────────────────────────────────────── */

      border-radius: 16px;
      box-shadow: inset 0 0 60px rgba(0,0,0,.5), 0 0 0 1px rgba(245,158,11,.15);
    }
  </style>
</head>

  <script type="module">
    // ── Firebase 실시간 통계 ──────────────────────────────────────────────────────
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    const FB_CONFIG = {
      apiKey: 'AIzaSyBETZfUgG4y0YAiYuxSVhwnhpwzVUQ59EI',
      authDomain: 'experience-factory-4e167.firebaseapp.com',
      projectId: 'experience-factory-4e167',
      storageBucket: 'experience-factory-4e167.firebasestorage.app',
      messagingSenderId: '142042867302',
      appId: '1:142042867302:web:7689eca32aaee5d189efa7',
    };
    const app = getApps().length ? getApps()[0] : initializeApp(FB_CONFIG);
    const db  = getFirestore(app);

    const elUsers    = document.getElementById('stat-users');
    const elTreasure = document.getElementById('stat-treasure');
    const today = new Date().toISOString().slice(0, 10);

    onSnapshot(doc(db, 'stats', 'public'), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();

      if (elUsers) {
        const count = (data.userCount || 0) + 10000;
        elUsers.textContent = count.toLocaleString() + '+';
      }

      if (elTreasure) {
        const sameDay = data.treasureDate === today;
        const count = sameDay ? (data.treasureTodayCount || 0) : 0;
        elTreasure.textContent = count.toLocaleString();
      }
    });

    // ── i18n ────────────────────────────────────────────────────────────────────
    const MESSAGES = {

    const LANGS = ['ko', 'en', 'vi'];
    let lang = localStorage.getItem('trs_lang') || 'ko';

    function _t(key) {
      const e = MESSAGES[key];
      if (!e) return key;
      return e[lang] ?? e['ko'] ?? key;
    }

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = _t(el.dataset.i18n);
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        lang = btn.dataset.lang;
        localStorage.setItem('trs_lang', lang);
        applyLang();
      });
    });

    // ── Scroll fade-in ────────────────────────────────────────────────────────
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));

    // ── Init ──────────────────────────────────────────────────────────────────
    applyLang();
  </script>
